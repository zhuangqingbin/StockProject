jobs:
  - name: stock_daily
    fetcher: StockDailyFetch
    table_name: stock_daily
    mirror_table_names:
      - daily_kline
    trigger_stock_bi_sync: true
    params:
      trade_date: "{{ trade_date_compact }}"
    scope_columns:
      - trade_date

  - name: stock_daily_basic
    fetcher: StockDailyBasicFetch
    table_name: stock_daily_basic
    mirror_table_names:
      - daily_basic
    trigger_stock_bi_sync: true
    params:
      trade_date: "{{ trade_date_compact }}"
    scope_columns:
      - trade_date

  - name: money_flow
    fetcher: MoneyFlowFetch
    table_name: stock_money_flow
    mirror_table_names:
      - moneyflow
