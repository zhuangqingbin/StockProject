[tool.stockproject]
python = ">=3.11"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = [
    "apps/data_hub/tests",
    "apps/data_hub/data_explorer/tests",
    "apps/data_hub/data_pipeline_ts/tests",
    "apps/data_hub/data_pipeline_ak/tests",
]
norecursedirs = [
    ".git",
    ".idea",
    ".worktrees",
    ".venv",
    ".venv-*",
    ".next",
    "node_modules",
    "dist",
    ".cache",
    ".logs",
    "assets",
    "experiments",
    "Work",
]
python_files = ["test_*.py"]
