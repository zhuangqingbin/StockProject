site_name: StockProject 文档
docs_dir: site_docs
site_dir: site
dev_addr: 127.0.0.1:8200
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.instant
    - search.suggest
    - search.highlight

nav:
  - 首页: index.md
  - 快速上手: getting-started.md
  - Data Hub:
      - 概览: data-hub/index.md
      - data_pipeline_ts: data-hub/data-pipeline-ts.md
      - data_pipeline_ak: data-hub/data-pipeline-ak.md
      - data_explorer: data-hub/data-explorer.md
      - Analysis:
          - 概览: data-hub/analysis/index.md
          - 策略套件: data-hub/analysis/strategy-suite.md
          - 研究结论: data-hub/analysis/findings.md
  - Quant Platform:
      - 概览: quant-platform/index.md
      - 研究: quant-platform/research.md
  - Ops / Dev:
      - 环境变量: ops/environment.md
      - 测试: ops/testing.md
      - 常用命令: ops/common-commands.md
  - 仓库治理:
      - 概览: repo-governance/index.md
      - 文档清单: repo-governance/inventory.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
